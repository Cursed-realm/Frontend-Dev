<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Interactive FAQ — Q3</title>
    <style>
      body {
        font-family: Inter, system-ui, -apple-system, Roboto, "Segoe UI", Arial;
        color: #0f172a;
        background: linear-gradient(180deg, #eef2ff 0%, #f8fbff 100%);
        padding: 28px;
      }
      .page {
        max-width: 920px;
        margin: 0 auto;
      }
      h1 {
        color: #0f172a;
      }
      .hint {
        color: #475569;
        margin-bottom: 14px;
      }
      .note {
        margin-top: 16px;
        color: #475569;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>Interactive FAQ (Q3)</h1>
      <div class="hint">
        Click a question to toggle its answer. Hover to change color.
        Double-click a question to collapse all answers. Focus an input to
        highlight the question.
      </div>

      <div id="faq-root"></div>

      <div class="note">
        Tips: Double-click empty area to collapse all; press Enter or Space on a
        question to toggle.
      </div>
    </div>

    <script src="InteractiveFAQ.js"></script>
  </body>
</html>
