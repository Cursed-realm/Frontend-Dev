<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio</title>
    <style>
      :root {
        font-size: 16px;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background: #0f1724;
        color: #eef2ff;
        font-family: Arial, Helvetica, sans-serif;
      }

      header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background: #062a4f;
        color: #ffffff;
        padding: 0.75rem 1rem;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        z-index: 10;
      }

      header .brand {
        font-size: 1.25rem;
        font-weight: 700;
      }

      nav {
        margin-top: 0.25rem;
      }

      nav a {
        color: #bfe4ff;
        margin-right: 1rem;
        text-decoration: none;
        font-size: 0.95rem;
      }
      main {
        flex: 1;
        padding-top: 72px;
        padding: 2rem 1.25rem;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        background: #071a2b;
        padding: 1.5rem 2rem;
        border-radius: 8px;
      }

      .profile {
        display: flex;
        align-items: center;
        gap: 1.25rem;
      }

      .profile img {
        width: 12rem;
        height: 12rem;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #154a6b;
      }

      .bio {
        font-size: 1rem /* rem */;
        line-height: 1.5;
      }

      .bio h2 {
        font-size: 1.5em;
        margin: 0 0 0.5em 0;
      }

      .bio p {
        font-size: 0.95rem;
        color: #d9eefc;
      }

      footer {
        background: #031827;
        color: #9fc6e6;
        padding: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.9rem;
      }

      @media (max-width: 600px) {
        .profile {
          flex-direction: column;
          text-align: center;
        }

        .profile img {
          width: 30vh;
          height: 30vh;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <div class="brand">Aditya Kumar Sharma</div>
      <nav>
        <a href="#">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main>
      <div class="container">
        <section class="profile">
          <img src="Aditya.jpg" alt="Profile image">
          <div class="bio">
            <h2>Bio</h2>
            <p>
              Hello — I'm a front-end developer who enjoys building accessible,
              responsive websites. I like experimenting with layout and CSS
              units like px, em, rem, % and vh to create flexible designs.
            </p>
          </div>
        </section>
      </div>
    </main>

    <footer>
      <div>&copy; 2025 Aditya Kumar Sharma — Built with HTML &amp; CSS</div>
    </footer>
  </body>
</html>
