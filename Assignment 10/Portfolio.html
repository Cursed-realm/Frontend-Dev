<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John Doe - Portfolio</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="Portfolio.css">
</head>
<body class="bg-light">
    <!-- Header Section -->
    <header class="bg-dark text-white text-center p-5 mt-4">
        <div class="container">
            <h1 class="fw-bold mb-3">Aditya Kumar Sharma</h1>
            <p class="lead">Full Stack Developer | Creative Problem Solver</p>
        </div>
    </header>

    <!-- Main Content Section -->
    <main class="container text-center mt-5 mb-5">
        <!-- Profile Image -->
        <div class="mb-4">
            <img src="Aditya.jpg" 
                 alt="Profile Picture" 
                 class="img-fluid rounded-circle shadow">
        </div>

        <!-- About Section -->
        <div class="mt-4 mb-4">
            <h2 class="fw-bold mb-3">Welcome to My Portfolio</h2>
            <p class="text-dark mb-4">
                I'm a passionate developer with expertise in creating modern web applications. 
                Let's build something amazing together!
            </p>
        </div>

        <!-- Action Buttons -->
        <div class="mt-4 mb-5">
            <button class="btn btn-primary btn-lg me-3 mb-2">Hire Me</button>
            <button class="btn btn-outline-secondary btn-lg mb-2">Download CV</button>
        </div>

        <!-- Contact Form -->
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="bg-white p-5 rounded shadow-sm">
                    <h3 class="fw-bold mb-4 text-dark">Get In Touch</h3>
                    <form>
                        <div class="mb-3">
                            <input type="text" 
                                   class="form-control" 
                                   placeholder="Your Name" 
                                   required>
                        </div>
                        <div class="mb-3">
                            <input type="email" 
                                   class="form-control" 
                                   placeholder="Your Email" 
                                   required>
                        </div>
                        <div class="mb-3">
                            <textarea class="form-control" 
                                      rows="4" 
                                      placeholder="Your Message" 
                                      required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-4 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2024 Aditya Kumar Sharma. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
