<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student Report</title>
  </head>
  <body>
    <h1>Greenfield High School</h1>

    <table border="1" cellpadding="6" cellspacing="0" title="Student marks for Semester 1">
      <caption>Student Mark Report</caption>
      <thead>
        <tr>
          <th rowspan="2">Student Name</th>
          <th colspan="3">Subjects</th>
          <th rowspan="2">Remarks</th>
        </tr>
        <tr>
          <th title="First Subject">Mathematics</th>
          <th title="Second Subject">Science</th>
          <th title="Third Subject">English</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>John Doe</td>
          <td>88</td>
          <td>92</td>
          <td>81</td>
          <td>Excellent</td>
        </tr>
        <tr>
          <td>Jane Smith</td>
          <td>76</td>
          <td>85</td>
          <td>79</td>
          <td>Good</td>
        </tr>
        <tr>
          <td>Sam Lee</td>
          <td>91</td>
          <td>89</td>
          <td>94</td>
          <td>Outstanding</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="2">Total</td>
          <td colspan="2">Total Marks: 525</td>
          <td>Percentage: 87.5%</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
