<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Map Embed</title>
</head>
<body>
  <div class=>
    <h1>Map</h1>
    <iframe
      src="https://maps.google.com/maps?q=Tokyo,+Japan&output=embed"
      title="Map of Japan"
      width="100%"
      height="450"
      style="border:0;"
      loading="lazy"
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
