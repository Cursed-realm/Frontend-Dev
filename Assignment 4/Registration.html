<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Registration</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;padding:1rem}
    form{max-width:420px;margin:0 auto}
    label{display:block;margin-top:0.75rem}
    input{width:100%;padding:0.5rem;margin-top:0.25rem}
    .error{color:#b00;margin-top:0.5rem}
  </style>
</head>
<body>
  <h1>User Registration</h1>
  <form id="regForm" onsubmit="return checkPasswords();">
    <label for="fullName">Full Name</label>
    <input type="text" id="fullName" name="fullName" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>

    <label for="confirm">Confirm Password</label>
    <input type="password" id="confirm" name="confirm" required>

    <div class="error" id="errorMsg" aria-live="polite"></div>

    <button type="submit" style="margin-top:1rem">Register</button>
  </form>

  <script>
    function checkPasswords(){
      var p = document.getElementById('password').value;
      var c = document.getElementById('confirm').value;
      var err = document.getElementById('errorMsg');
      if(p !== c){
        err.textContent = 'Passwords do not match.';
        return false; // prevent submit
      }
      err.textContent = '';
      alert('Form submitted (client-side).');
      return true; // allow submit in demo — in real app submit to server
    }
  </script>
</body>
</html>
