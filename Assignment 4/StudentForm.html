<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Information</title>
  <style>body{font-family:system-ui,Segoe UI,Roboto,Arial;padding:1rem}form{max-width:520px;margin:0 auto}label{display:block;margin-top:0.75rem}input,select{width:100%;padding:0.5rem;margin-top:0.25rem}</style>
</head>
<body>
  <h1>Student Information</h1>
  <form method="post" action="#">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" placeholder="Full name" required>

    <label for="roll">Roll Number</label>
    <input type="text" id="roll" name="roll" placeholder="e.g. 23152000xx" required>

    <label for="course">Course</label>
    <select id="course" name="course" required>
      <option value="" disabled selected>Select Course</option>
      <option value="cs">Computer Science</option>
      <option value="it">Information Technology</option>
      <option value="ece">Electronics and Communication</option>
      <option value="me">Mechanical Engineering</option>
    </select>

    <button type="submit" style="margin-top:1rem">Submit</button>
  </form>
</body>
</html>
