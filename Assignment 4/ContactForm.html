<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Form</title>
  <style>body{font-family:system-ui,Segoe UI,Roboto,Arial;padding:1rem}form{max-width:640px;margin:0 auto}label{display:block;margin-top:0.75rem}input,textarea{width:100%;padding:0.5rem;margin-top:0.25rem}</style>
</head>
<body>
  <h1>Contact Us</h1>
  <form method="post" action="#">
    <label for="fullname">Full Name</label>
    <input type="text" id="fullname" name="fullname" placeholder="Aditya Kumar Sharma" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="ak47@gmail.com" required>

    <label for="subject">Subject</label>
    <input type="text" id="subject" name="subject" placeholder="Subject of your message" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>

    <button type="submit" style="margin-top:1rem">Send Message</button>
  </form>
</body>
</html>
