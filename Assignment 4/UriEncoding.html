<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URI Encoding Demo</title>
</head>
<body>
  <h1>URI Encoding</h1>
  <p>Unencoded URL (unsafe): https://example.com/search?query=HTML & CSS</p>
  <p>Encoded URL (safe): <a href="https://example.com/search?query=HTML%20%26%20CSS">https://example.com/search?query=HTML%20%26%20CSS</a></p>
</body>
</html>
