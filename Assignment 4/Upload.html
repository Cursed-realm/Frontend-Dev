<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>File Upload</title>
  <style>body{font-family:system-ui,Segoe UI,Roboto,Arial;padding:1rem}form{max-width:520px;margin:0 auto}label{display:block;margin-top:0.75rem}</style>
</head>
<body>
  <h1>Upload Image</h1>
  <p>Allowed file types: .jpg, .jpeg, .png (image files only).</p>

  <form method="post" action="#" enctype="multipart/form-data" onsubmit="alert('Upload submitted (demo)'); return false;">
    <label for="image">Choose an image</label>
    <input type="file" id="image" name="image" accept="image/jpeg,image/png" required>

    <button type="submit" style="margin-top:1rem">Upload</button>
  </form>
</body>
</html>
