<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form with iframe</title>
</head>
<body>
  <h1>Submit Form</h1>
  <form method="GET" action="result.html" target="resultFrame">
    <label for="text">Enter text</label>
    <input type="text" id="text" name="text">
    <button type="submit">Submit</button>
  </form>
</body>
</html>
