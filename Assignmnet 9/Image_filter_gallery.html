<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <header>
        <h1>My Image Gallery</h1>
    </header>
    <main>
        <section class="gallery">
            <figure>
                <img src="Busan.avif" class="blur" alt="Blur effect">
                <figcaption>Busan</figcaption>
            </figure>
            <figure>
                <img src="china.webp" class="grayscale" alt="grayscale effect">
                <figcaption>China</figcaption>
            </figure>
            <figure>
                <img src="mizoram.jpeg" class="sepia" alt="sepia effect">
                <figcaption>Mizoram</figcaption>
            </figure>
            <figure>
                <img src="sanjose.webp" class="contrast" alt="contrast effect">
                <figcaption>San Jose</figcaption>
            </figure>
            <figure>
                <img src="udaipur.webp" class="brightness" alt="brightness effect">
                <figcaption>Udaipur</figcaption>
            </figure>
            <figure>
                <img src="papa.jpg" class="hue-rotate" alt="hue-rotate effect">
                <figcaption>papa</figcaption>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 My Image Gallery</p>
    </footer>
</body>
</html>
