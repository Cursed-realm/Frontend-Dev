<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison</title>
    <link rel="stylesheet" href="filter-comparison.css">
</head>
<body>

<header>
    <h1>Filter Comparison Layout</h1>
</header>

<main class="image-container">
    <section class="img-block">
        <img src="sanjose.webp" alt="Original Image">
        <p>Before Filter</p>
    </section>

    <section class="img-block filtered">
        <img src="sanjose.webp" alt="Filtered Image">
        <p>After Filter (Brightness)</p>
    </section>
</main>

</body>
</html>
