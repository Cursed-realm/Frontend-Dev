<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style6.css">
    <title>Responsive CSS Cheat Sheet</title>
</head>
<body>

<h2 class="title">Responsive CSS Cheat Sheet</h2>

<div class="grid">

    <div class="box">
        <h3>Filters</h3>
        <p>Example: filter: grayscale(100%);</p>
    </div>

    <div class="box">
        <h3>Media Queries</h3>
        <p>@media(max-width:700px){ ... }</p>
    </div>

    <div class="box">
        <h3>Responsive Design</h3>
        <p>Use fluid units like %, rem, and vw instead of px.</p>
    </div>

    <div class="box">
        <h3>Typography</h3>
        <p>Use clamp() for scalable font sizes.</p>
    </div>

</div>

</body>
</html>
