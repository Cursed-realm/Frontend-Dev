<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Button Collection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            color: #2d3436;
            margin-bottom: 3rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            margin-bottom: 3rem;
            justify-content: center;
        }

        .button-section {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        .section-title {
            color: #2d3436;
            margin-bottom: 1.5rem;
            font-size: 1.25rem;
        }

        /* Base Button Styles */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            min-width: 120px;
            text-decoration: none;
        }

        /* Primary Button */
        .btn-primary {
            background: #3498db;
            color: white;
            box-shadow: 0 2px 4px rgba(52, 152, 219, 0.2);
        }

        .btn-primary:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(52, 152, 219, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
            box-shadow: 0 2px 4px rgba(52, 152, 219, 0.2);
        }

        /* Secondary Button */
        .btn-secondary {
            background: #2ecc71;
            color: white;
            box-shadow: 0 2px 4px rgba(46, 204, 113, 0.2);
        }

        .btn-secondary:hover {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(46, 204, 113, 0.3);
        }

        .btn-secondary:active {
            transform: translateY(0);
            box-shadow: 0 2px 4px rgba(46, 204, 113, 0.2);
        }

        /* Outline Buttons */
        .btn-outline-primary {
            border: 2px solid #3498db;
            color: #3498db;
            background: transparent;
        }

        .btn-outline-primary:hover {
            background: #3498db;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(52, 152, 219, 0.2);
        }

        .btn-outline-primary:active {
            transform: translateY(0);
            box-shadow: 0 2px 4px rgba(52, 152, 219, 0.2);
        }

        .btn-outline-secondary {
            border: 2px solid #2ecc71;
            color: #2ecc71;
            background: transparent;
        }

        .btn-outline-secondary:hover {
            background: #2ecc71;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(46, 204, 113, 0.2);
        }

        .btn-outline-secondary:active {
            transform: translateY(0);
            box-shadow: 0 2px 4px rgba(46, 204, 113, 0.2);
        }

        /* Disabled Button */
        .btn-disabled, .btn:disabled {
            background: #bdc3c7;
            color: #7f8c8d;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .btn-disabled:hover, .btn:disabled:hover {
            transform: none;
            box-shadow: none;
        }

        /* Focus States */
        .btn:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.4);
        }

        .btn-secondary:focus {
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.4);
        }

        /* Loading Button */
        .btn-loading {
            position: relative;
            color: transparent;
            pointer-events: none;
        }

        .btn-loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Styled Button Collection</h1>

        <div class="button-section">
            <h2 class="section-title">Primary & Secondary Buttons</h2>
            <div class="button-group">
                <button class="btn btn-primary">Primary Button</button>
                <button class="btn btn-secondary">Secondary Button</button>
            </div>
        </div>

        <div class="button-section">
            <h2 class="section-title">Outline Buttons</h2>
            <div class="button-group">
                <button class="btn btn-outline-primary">Outline Primary</button>
                <button class="btn btn-outline-secondary">Outline Secondary</button>
            </div>
        </div>

        <div class="button-section">
            <h2 class="section-title">States & Effects</h2>
            <div class="button-group">
                <button class="btn btn-primary btn-loading">Loading</button>
                <button class="btn btn-disabled">Disabled Button</button>
                <button class="btn btn-primary" disabled>Disabled Primary</button>
            </div>
        </div>

        <div class="button-section">
            <h2 class="section-title">Interactive Demo</h2>
            <div class="button-group">
                <button class="btn btn-primary">Hover Me!</button>
                <button class="btn btn-outline-secondary">Click Me!</button>
                <button class="btn btn-secondary">Focus Me!</button>
            </div>
        </div>
    </div>
</body>
</html>
