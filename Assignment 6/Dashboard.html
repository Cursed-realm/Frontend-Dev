<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard - CSS Grid</title>
    <style>
      :root {
        --bg: #f5f7fa;
        --header: #1f2937;
        --sidebar: #111827;
        --card: #ffffff;
        --accent: #60a5fa;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: #111;
      }

      .dashboard {
        display: grid;
        grid-template-columns: 1fr 3fr;
        grid-template-rows: auto 1fr auto;
        grid-gap: 1rem;
        grid-template-areas:
          "header header"
          "sidebar main"
          "footer footer";
        min-height: 100vh;
        padding: 1rem;
      }
      header {
        grid-area: header;
        background: var(--header);
        color: #fff;
        padding: 1rem 1.25rem;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        font-weight: 700;
      }

      .sidebar {
        grid-area: sidebar;
        background: var(--sidebar);
        color: #e5e7eb;
        padding: 1rem;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .sidebar a {
        color: inherit;
        text-decoration: none;
        padding: 0.5rem 0.6rem;
        border-radius: 6px;
        display: inline-block;
      }
      .sidebar a:hover,
      .sidebar a:focus {
        background: rgba(255, 255, 255, 0.04);
        outline: none;
      }

      .main {
        grid-area: main;
        background: transparent;
        padding: 0;
        display: flex;
        flex-direction: column;
      }

      .main-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: 180px;
        gap: 1rem;
      }
      .card {
        background: var(--card);
        border-radius: 8px;
        padding: 1rem;
        box-shadow: 0 6px 18px rgba(17, 24, 39, 0.06);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
        transform-origin: center;
      }
      /* Make one box span two columns */
      .card.span-2 {
        grid-column: span 2;
      }
      .card:hover,
      .card:focus {
        transform: scale(1.03);
        box-shadow: 0 18px 40px rgba(17, 24, 39, 0.12);
        outline: none;
      }

      footer {
        grid-area: footer;
        background: var(--header);
        color: #e5e7eb;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        text-align: center;
      }

      @media (max-width: 900px) {
        .dashboard {
          grid-template-columns: 1fr;
          grid-template-areas:
            "header"
            "sidebar"
            "main"
            "footer";
        }
        .main-grid {
          grid-template-columns: 1fr;
          grid-auto-rows: 160px;
        }
        .card.span-2 {
          grid-column: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="dashboard">
      <header>
        <div class="brand">Acme Dashboard</div>
        <div class="user">Admin</div>
      </header>

      <aside class="sidebar" aria-label="Sidebar navigation">
        <a href="#overview">Overview</a>
        <a href="#analytics">Analytics</a>
        <a href="#reports">Reports</a>
        <a href="#settings">Settings</a>
      </aside>

      <main class="main">
        <div class="main-grid">
          <section class="card span-2" tabindex="0">
            <h3>Summary (spans two columns)</h3>
            <p style="margin: 0.25rem 0 0 0; color: #374151">
              Key metrics and quick overview.
            </p>
          </section>

          <section class="card" tabindex="0">
            <h3>Recent Activity</h3>
            <p style="margin: 0.25rem 0 0 0; color: #374151">
              Latest events and logs.
            </p>
          </section>

          <section class="card" tabindex="0">
            <h3>Tasks</h3>
            <p style="margin: 0.25rem 0 0 0; color: #374151">
              Open tasks and priorities.
            </p>
          </section>

          <section class="card" tabindex="0">
            <h3>Notifications</h3>
            <p style="margin: 0.25rem 0 0 0; color: #374151">
              Alerts and system messages.
            </p>
          </section>
        </div>
      </main>

      <footer>© 2025 Acme Corp — Dashboard</footer>
    </div>
  </body>
</html>
