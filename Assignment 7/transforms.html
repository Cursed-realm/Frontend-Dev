<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations Showcase</title>
    <link rel="stylesheet" href="transforms.css">
</head>
<body>
    <div class="main">
        <header class="header">
            <h1>CSS Transformations</h1>
            <p>Hover over the boxes to see the transformations in action</p>
        </header>

        <div class="container">
            <div class="box-wrapper">
                <div class="box rotate-box"></div>
                <label>rotate(45deg)</label>
            </div>

            <div class="box-wrapper">
                <div class="box scale-box"></div>
                <label>scale(1.5)</label>
            </div>

            <div class="box-wrapper">
                <div class="box translate-box"></div>
                <label>translate(50px, 50px)</label>
            </div>

            <div class="box-wrapper">
                <div class="box skew-box"></div>
                <label>skew(20deg, 10deg)</label>
            </div>
        </div>

        <footer class="footer">
            <p>&copy; 2025 CSS Transformations | Interactive Demo</p>
        </footer>
    </div>
</body>
</html>
